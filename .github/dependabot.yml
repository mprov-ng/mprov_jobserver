# Keep the GitHub Actions used by the workflows, and the container's python
# packages, up to date.  Each ecosystem's updates come as one pull request a
# week.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
  # The job server container's pinned python dependencies (#166).  Only
  # container/: the package's own requirements.txt keeps its floors.
  - package-ecosystem: "pip"
    directory: "/container"
    schedule:
      interval: "weekly"
    # The package's requirements.txt pins these two exactly, so an update
    # here can't install (#253).  pyroute2 0.9 also needs Python >= 3.9,
    # and Rocky 8 images run 3.8 (#111).
    ignore:
      - dependency-name: "pyparted"
      - dependency-name: "pyroute2"
    groups:
      container-python:
        patterns:
          - "*"
