name: Python Module CI and Docker build.
on:
  release: 
    types: [published]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      # to commit the next dev version to main.
      contents: write
    steps:
      - 
        name: Checkout 
        uses: actions/checkout@v2
      
      - name: Setup Python 3.8
        uses: actions/setup-python@v3
        with:
          python-version: "3.8"
        
      - name: Install Dependancies
        run: |
          sudo apt-get update
          sudo apt-get install libparted-dev libparted2
          python -m pip install --upgrade pip
          pip install setuptools build
          pip install -r requirements.txt
          sudo ln -sf /usr/bin/python /usr/bin/python3
      
      - name: Parse the version
        id: vars
        run: echo tag=$(echo ${GITHUB_REF:10}) >> $GITHUB_ENV

      - name: Build Package
        run: |
          echo "$tag" > VERSION
          python -m build
      
      - name: Publish Package to Pypi
        uses: pypa/gh-action-pypi-publish@27b31702a0e7fc50959f5ad993c78deac1bdfc29
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}

      - 
        name: Setup buildx
        id: buildx
        uses: docker/setup-buildx-action@v1

      - 
        name: Login to GHCR
        uses: docker/login-action@v1
        with:
          registry: ghcr.io
          username: ${{ secrets.CR_USER }}
          password: ${{ secrets.CR_PAT }}

      - 
        name: Build the mProv Jobserver Docker Image
        uses: docker/build-push-action@v2
        with:
          # the checkout, so dist/ has the wheel built above.
          context: .
          tags: |
            ghcr.io/mprov-ng/mprov-jobserver:${{ env.tag }}
            ghcr.io/mprov-ng/mprov-jobserver:latest
          push: true

      # main builds as the next release plus .devN (see dockerimage-dev.yml),
      # so start the next one: v0.0.63 sets VERSION to 0.0.64.dev0.  Skipped
      # if main is already past it, e.g. for a release of an older branch.
      - name: Move main to the next dev version
        run: |
          release=${tag#v}
          next="${release%.*}.$(( ${release##*.} + 1 )).dev0"
          git fetch origin main
          git checkout -f -B main origin/main
          current=$(sed 's/\.dev[0-9]*$//' VERSION)
          if [ "$(printf '%s\n' "$current" "${next%.dev0}" | sort -V | tail -n1)" = "$current" ]; then
            echo "VERSION on main is already $(cat VERSION); leaving it."
            exit 0
          fi
          echo -n "$next" > VERSION
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Start $next after the $tag release" VERSION
          git push origin main
