name: Python Module CI and Docker build.
on:
  release:
    types: [published]
  # Pull requests that change the build run it as a dry run: everything up
  # to publishing, so action and build changes are tested before merge.
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/ci_build.yml'
      - 'setup.py'
      - 'setup.cfg'
      - 'pyproject.toml'
      - 'requirements.txt'
      - 'Dockerfile'
      - 'Containerfile'
      - 'VERSION'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      # to commit the next dev version to main.
      contents: write
    steps:
      -
        name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Dependancies
        run: |
          sudo apt-get update
          sudo apt-get install -y libparted-dev
          python -m pip install --upgrade pip
          pip install setuptools build twine
          pip install -r requirements.txt

      # A release builds the tag.  A dry run builds the release main is
      # heading for, e.g. v0.0.63 for VERSION 0.0.63.dev0.
      - name: Parse the version
        run: |
          if [ "$GITHUB_EVENT_NAME" = "release" ]; then
            tag=${GITHUB_REF#refs/tags/}
          else
            tag=v$(sed 's/\.dev[0-9]*$//' VERSION)
          fi
          echo "tag=$tag" >> "$GITHUB_ENV"

      - name: Build Package
        run: |
          echo "$tag" > VERSION
          python -m build
          twine check dist/*

      - name: Publish Package to Pypi
        if: github.event_name == 'release'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}

      -
        name: Setup buildx
        id: buildx
        uses: docker/setup-buildx-action@v4

      -
        name: Login to GHCR
        if: github.event_name == 'release'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ secrets.CR_USER }}
          password: ${{ secrets.CR_PAT }}

      -
        name: Build the mProv Jobserver Docker Image
        uses: docker/build-push-action@v7
        with:
          # the checkout, so dist/ has the wheel built above.
          context: .
          tags: |
            ghcr.io/mprov-ng/mprov-jobserver:${{ env.tag }}
            ghcr.io/mprov-ng/mprov-jobserver:latest
          push: ${{ github.event_name == 'release' }}

      # main builds as the next release plus .devN (see dockerimage-dev.yml),
      # so start the next one: v0.0.63 sets VERSION to 0.0.64.dev0.  Skipped
      # if main is already past it, e.g. for a release of an older branch.
      # A dry run makes the commit but doesn't push it.
      - name: Move main to the next dev version
        run: |
          release=${tag#v}
          next="${release%.*}.$(( ${release##*.} + 1 )).dev0"
          git fetch origin main
          git checkout -f -B main origin/main
          current=$(sed 's/\.dev[0-9]*$//' VERSION)
          if [ "$(printf '%s\n' "$current" "${next%.dev0}" | sort -V | tail -n1)" = "$current" ]; then
            echo "VERSION on main is already $(cat VERSION); leaving it."
            exit 0
          fi
          echo -n "$next" > VERSION
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Start $next after the $tag release" VERSION
          if [ "$GITHUB_EVENT_NAME" = "release" ]; then
            git push origin main
          else
            echo "Dry run: would push this to main:"
            git show --stat HEAD
          fi
