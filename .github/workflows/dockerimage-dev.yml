name: Docker Image CI for Dev
on:
  push:
    branches:
      - main
  # Pull requests build the image too, without logging in or pushing.
  pull_request:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    # a build normally takes about 10 minutes; fail a hung one instead of
    # waiting for GitHub's 6-hour limit.
    timeout-minutes: 30
    steps:
      -
        name: Checkout
        uses: actions/checkout@v7
        with:
          # all history and tags, to count the commits since the last release.
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # VERSION holds the next release as X.Y.Z.dev0.  Build as
      # X.Y.Z.devN, where N is the number of commits since the last release
      # tag, so every build from main has its own increasing version.
      - name: Set the dev version
        run: |
          base=$(sed 's/\.dev[0-9]*$//' VERSION)
          last=$(git describe --tags --abbrev=0)
          if [ "$(printf '%s\n' "${last#v}" "$base" | sort -V | tail -n1)" = "${last#v}" ]; then
            echo "Error: VERSION ($base) isn't newer than the last release ($last)."
            exit 1
          fi
          version="$base.dev$(git rev-list --count "$last"..HEAD)"
          echo -n "$version" > VERSION
          echo "version=$version" >> "$GITHUB_ENV"

      # The Dockerfile installs the wheel from dist/, instead of the last
      # release from PyPI.
      - name: Build the wheel
        run: |
          pip install build
          python -m build --wheel

      -
        name: Setup buildx
        id: buildx
        uses: docker/setup-buildx-action@v4

      # Build the image without pushing it, and load it into the runner's
      # Docker, so the tests run against the image that ships.
      -
        name: Build Development Docker Image
        uses: docker/build-push-action@v7
        with:
          # the checkout, so dist/ has the wheel built above.
          context: .
          tags: |
            ghcr.io/mprov-ng/mprov-jobserver:dev
            ghcr.io/mprov-ng/mprov-jobserver:${{ env.version }}
          load: true
          push: false

      # tests/Dockerfile adds pytest and genders to the image just built.
      # The default builder uses the runner's Docker, where that image was
      # loaded; the buildx builder set up above can't see it.
      - name: Run tests
        run: |
          docker buildx build --builder default --load -f tests/Dockerfile \
            --build-arg JOBSERVER_IMAGE=ghcr.io/mprov-ng/mprov-jobserver:${{ env.version }} \
            -t mprov-jobserver-tests .
          docker run --rm mprov-jobserver-tests

      # Publish the tested image.  Only for pushes to main; pull requests
      # stop after the tests.
      -
        name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ secrets.CR_USER }}
          password: ${{ secrets.CR_PAT }}

      - name: Publish Development Docker Image
        if: github.event_name == 'push'
        run: |
          docker push ghcr.io/mprov-ng/mprov-jobserver:dev
          docker push ghcr.io/mprov-ng/mprov-jobserver:${{ env.version }}
