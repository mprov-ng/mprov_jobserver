- bmc-rotate:
    # check the BMCs' HTTPS certificates (Redfish).  Off by default: BMCs
    # mostly have self-signed ones.  The mPCC's report flags a change made
    # without checking.
    verifyBMC: False
    # the CA certificate file to check them with, if not the OS bundle
    bmcCABundle: ''
    # how many BMCs to work on at once
    parallel: 4
    # IPMI, for a BMC without Redfish
    ipmiChannel: 1
    ipmiInterface: 'lanplus'
    # seconds to wait for a BMC.  BMCs can take half a minute to apply an
    # account change; one slower than this is reported unconfirmed, and the
    # mPCC's "Find which credentials work" recovers it.
    timeout: 60
